version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gocritic
    - revive
    - misspell
    - bodyclose
    - errorlint
    - gosec

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
